[project]
name = "tinyconformal"
version = "0.3.0"
description = "A small toolbox for conformal prediction"
license = "MIT"
authors = [{name = "Lucas Leão", email = "heylucasleao@gmail.com"}]
keywords = ["machine-learning", "conformal-prediction"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy (>=1.24.4)",
    "venn-abers (>=1.4.6)",
    "scikit-learn (>=1.3.0)",
    "quantile-forest>=1.4.2",
]
requires-python = ">=3.10"

[project.optional-dependencies]
plot = [
    "tinyshift[plot]",
]

notebook = [
    "nbformat>=5.10.4",
    "ipykernel>6.7.0",
]

series = [
    "statsforecast>=1.4.0",
    "mlforecast>=0.7.0",
    "utilsforecast>=0.1.0",
]

all = [
    "tinyshift[series,plot,notebook]",
]

dev = [
    "tinyshift[all]",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]